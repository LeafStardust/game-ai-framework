name: Balatro deterministic suite

on:
  push:
    branches:
      - feat/v1.0-red-white-competence
    paths:
      - "games/balatro/**"
      - "tests/balatro/**"
      - "ROADMAP.md"
      - "requirements.txt"
      - ".github/workflows/balatro-l3.yml"
  workflow_dispatch:

jobs:
  balatro-deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPDATA: /tmp/balatro-appdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic Balatro suites
        run: >-
          python -m pytest -q tests/balatro
          -k "translator or mechanics or legality or shop or target_hand or joker or voucher or pack or consumable or arbiter or boss or rng or env_contract or env_r0 or env_r1"
